# Target companies. THIS is the file you edit to point the crawler at your own target list:
# add one line per company, in any industry. A wrong slug is harmless: the crawler skips it and
# lists it under `errors` in its JSON output, so you'll see the fix to make.
#
# How to find a company's slug: open its careers page and read the URL.
#   boards.greenhouse.io/<slug>   -> ats: greenhouse
#   jobs.lever.co/<slug>          -> ats: lever
#   jobs.ashbyhq.com/<slug>       -> ats: ashby
#
# Each ATS endpoint returns a company's ENTIRE job board; filters.yaml decides which of those
# postings actually match what you're looking for, so you can list any company here regardless
# of what role you're hunting; the title filter does the real targeting.

boards:
  - {company: "Example Co", ats: greenhouse, slug: "example-slug"}
  # Add your own companies below, then delete the example line above.
